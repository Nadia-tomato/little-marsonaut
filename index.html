<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LITTLE MARSONAUT — 2026 NASA Hackathon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #fdf6e9;
      color: #4a3525;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes flyToBasket {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      50% { transform: translate(110px, -40px) scale(1.3); opacity: 1; }
      100% { transform: translate(210px, 35px) scale(0.8); opacity: 0; }
    }
    .animate-fly-basket {
      animation: flyToBasket 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatBadge 2.2s ease-in-out infinite;
    }
    @keyframes roverCruise {
      0%, 100% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(18px) translateY(-2px); }
    }
    .animate-rover-cruise {
      animation: roverCruise 3.4s ease-in-out infinite;
    }
    @keyframes supplyHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-supply-hover {
      animation: supplyHover 2.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================

    const DAY_DURATION_SECONDS = 120;

    const INITIAL_RESOURCES = {

    const ROVER_DISPATCH_MODES = {

    const SAMPLE_CATALOG = [

      {

        baseProbability: 1,

        variations: [
          'Super discovery! Tiny swirls and special carbon clues found—let us send this to Earth!',
        ],

      },
      {

        points: 0,
        baseProbability: 30,

        variations: [
          'Only soft sand here! The robot arm could not grab a solid rock.',
          'Thick dust covered the ground so the drill could not reach hard rock.',
          'The rock was too soft and turned into dust when the rover grabbed it.',
        ],

      },
    ];

    const HISTORICAL_MARS_WEATHER = [
      { tempMax: -9,  tempMin: -68, windSpeedMs: 4.1 },
      { tempMax: -12, tempMin: -72, windSpeedMs: 5.2 },
      { tempMax: -16, tempMin: -77, windSpeedMs: 6.8 },
      { tempMax: -19, tempMin: -80, windSpeedMs: 7.1 },
      { tempMax: -24, tempMin: -86, windSpeedMs: 8.9 },
      { tempMax: -27, tempMin: -89, windSpeedMs: 9.4 },
    ];

    const RADIATION_LABELS = {
      1: { text: 'Very Safe', color: 'bg-emerald-500', advice: 'Calm sun rays—great day to send the rover!' },
      2: { text: 'Safe', color: 'bg-green-500', advice: 'Good space weather for exploring outside!' },
      3: { text: 'Medium', color: 'bg-amber-500', advice: 'Sun rays (radiation) are a bit strong today.' },
      4: { text: 'High', color: 'bg-orange-500', advice: 'Strong sun rays (radiation) might break the rover!' },
      5: { text: 'Danger', color: 'bg-red-500', advice: 'Huge sun storm! Keep the rover safe inside.' },
    };

    // =========================================================================
    // [Color Gradient Interpolation Helper for Smooth Day/Night Transition]
    // =========================================================================
    function lerpHexColor(hexA, hexB, t) {
      const clamped = Math.max(0, Math.min(1, t));
      const a = parseInt(hexA.replace('#', ''), 16);
      const b = parseInt(hexB.replace('#', ''), 16);
      const rA = (a >> 16) & 255, gA = (a >> 8) & 255, bA = a & 255;
      const rB = (b >> 16) & 255, gB = (b >> 8) & 255, bB = b & 255;
      const r = Math.round(rA + (rB - rA) * clamped);
      const g = Math.round(gA + (gB - gA) * clamped);
      const bl = Math.round(bA + (bB - bA) * clamped);
      return `rgb(${r}, ${g}, ${bl})`;
    }

    function getDayNightPalette(nightFactor) {
      const t = Math.max(0, Math.min(1, nightFactor));
      let skyTop, skyMid, skyBot;
      if (t <= 0.5) {
        const u = t / 0.5;
        skyTop = lerpHexColor('#f5a97f', '#c26d5c', u);
        skyMid = lerpHexColor('#f7c49f', '#8c5368', u);
        skyBot = lerpHexColor('#e5885c', '#a85548', u);
      } else {
        const u = (t - 0.5) / 0.5;
        skyTop = lerpHexColor('#c26d5c', '#182236', u);
        skyMid = lerpHexColor('#8c5368', '#2a3752', u);
        skyBot = lerpHexColor('#a85548', '#4d322c', u);
      }
      return {
        skyTop,
        skyMid,
        skyBot,
        mountainFill: lerpHexColor('#d97a50', '#3d2522', t),
        groundTop: lerpHexColor('#e58758', '#6e3a28', t),
        groundBot: lerpHexColor('#c9653b', '#3d1e14', t),
        craterFill: lerpHexColor('#b85932', '#381810', t),
        domeGlassBlue: lerpHexColor('#79b4e3', '#facc15', t),
        powerGlassBlue: lerpHexColor('#6898d8', '#fde047', t),
        greenhouseGlass: lerpHexColor('#9be082', '#bef264', t),
        starOpacity: Math.max(0, Math.min(1, (t - 0.45) / 0.45)),
      };
    }

    // =========================================================================
    // [Module 2: NASA Data & Mars Weather Service]
    // =========================================================================
    const NasaService = (() => {
      const NASA_IMAGE_API = 'https://images-api.nasa.gov/search';
      const NASA_DONKI_SEP_API = 'https://api.nasa.gov/DONKI/SEP';
      const API_KEY = 'DEMO_KEY';

      let cachedCuriosityPhotos = [];
      let cachedSepEventsCount = null;

      async function fetchNextCuriosityPhoto(usedIds) {
        try {
          if (cachedCuriosityPhotos.length === 0) {
            const query = encodeURIComponent('Curiosity Mastcam Gale Crater');
            const response = await fetch(`${NASA_IMAGE_API}?q=${query}&media_type=image&page_size=60`);
            const json = await response.json();
            const items = json?.collection?.items || [];

            cachedCuriosityPhotos = items
              .filter((item) => {
                const info = item.data?.[0];
                if (!info?.nasa_id || !item.links?.[0]?.href) return false;
                const text = `${info.title || ''} ${info.description || ''}`.toLowerCase();
                const isCuriosity = text.includes('curiosity');
                const isNotArt = !text.includes('artist') && !text.includes('illustration') && !text.includes('concept');
                return isCuriosity && isNotArt;
              })
              .map((item) => {
                const info = item.data[0];
                const rawDesc = (info.description || info.title || '').replace(/<[^>]*>?/gm, '');
                const shortDesc = rawDesc.length > 130 ? `${rawDesc.slice(0, 130)}...` : rawDesc;
                return {
                  id: info.nasa_id,
                  title: info.title,
                  imageUrl: item.links[0].href,
                  nasaCaption: shortDesc,
                };
              });
          }
        } catch (err) {
          cachedCuriosityPhotos = [];
        }

        if (cachedCuriosityPhotos.length === 0) {
          return {
            id: 'FALLBACK_MARS',
            title: 'Mars Rocks and Sand Dunes',
            imageUrl: 'https://images-assets.nasa.gov/image/PIA16764/PIA16764~thumb.jpg',
            nasaCaption: 'Real Mars rocks and sandy ground taken by NASA Curiosity Rover.',
          };
        }

        const available = cachedCuriosityPhotos.filter((p) => !usedIds.has(p.id));
        const pool = available.length > 0 ? available : cachedCuriosityPhotos;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      async function generateDailyMarsEnvironment(sol) {
        if (cachedSepEventsCount === null) {
          try {
            const endDate = new Date().toISOString().slice(0, 10);
            const startObj = new Date();
            startObj.setDate(startObj.getDate() - 60);
            const startDate = startObj.toISOString().slice(0, 10);

            const res = await fetch(`${NASA_DONKI_SEP_API}?startDate=${startDate}&endDate=${endDate}&api_key=${API_KEY}`);
            const events = await res.json();
            cachedSepEventsCount = Array.isArray(events) ? events.length : 1;
          } catch (err) {
            cachedSepEventsCount = 1;
          }
        }

        const baseWeather = HISTORICAL_MARS_WEATHER[Math.floor(Math.random() * HISTORICAL_MARS_WEATHER.length)];
        const stormChance = sol <= 5 ? 0.20 : sol <= 10 ? 0.35 : sol <= 15 ? 0.50 : 0.60;
        const isDustStorm = Math.random() < stormChance;

        const activityBias = Math.min(2, Math.floor(cachedSepEventsCount / 2));
        const phaseBias = sol <= 5 ? 0 : sol <= 12 ? 1 : 2;
        const rawLevel = 1 + Math.floor(Math.random() * 2) + Math.floor((activityBias + phaseBias) / 2);
        const radiationLevel = Math.min(5, Math.max(1, rawLevel));

        return {
          tempMax: baseWeather.tempMax,
          tempMin: baseWeather.tempMin,
          windSpeedMs: isDustStorm ? +(baseWeather.windSpeedMs + 8.5).toFixed(1) : baseWeather.windSpeedMs,
          isDustStorm,
          radiationLevel,
        };
      }

      return { fetchNextCuriosityPhoto, generateDailyMarsEnvironment };
    })();

    // =========================================================================
    // [Module 3: Core Game Rules & Calculations]
    // =========================================================================
    const GameLogicModule = (() => {
      function rollRoverExplorationByCost(barsCost) {
        const mode = ROVER_DISPATCH_MODES[barsCost] || ROVER_DISPATCH_MODES[2];
        const roll = Math.random() * 100;
        let acc = 0;
        let chosenSpec = SAMPLE_CATALOG.find((s) => s.id === 'NONE');

        for (const sample of SAMPLE_CATALOG) {
          if (sample.id === 'NONE') continue;
          const weight = sample.isRare
            ? sample.baseProbability * mode.discoveryMultiplier * mode.rareBonus
            : sample.baseProbability * mode.discoveryMultiplier;

          acc += weight;
          if (roll < acc) {
            chosenSpec = sample;
            break;
          }
        }

        const randomStory =
          chosenSpec.variations[Math.floor(Math.random() * chosenSpec.variations.length)];

        return {
          ...chosenSpec,
          chosenExplanation: randomStory,
        };
      }

      function evaluateRoverReturnHazard(isDustStorm, radiationLevel) {
        let hazardChance = 0;
        const reasons = [];

        if (isDustStorm) {
          hazardChance += 0.35;
          reasons.push('dust storm sand stuck in the wheels');
        }
        if (radiationLevel === 4) {
          hazardChance += 0.30;
          reasons.push('strong sun rays (radiation)');
        } else if (radiationLevel === 5) {
          hazardChance += 0.55;
          reasons.push('a huge sun storm');
        }

        if (hazardChance > 0 && Math.random() < Math.min(0.85, hazardChance)) {
          const freezeSols = (isDustStorm && radiationLevel >= 4) || radiationLevel === 5 ? 2 : 1;
          return {
            isDamaged: true,
            damagedSols: freezeSols,
            reasonText: reasons.join(' and '),
          };
        }

        return {
          isDamaged: false,
          damagedSols: 0,
          reasonText: reasons.join(' and '),
          wasHazardous: hazardChance > 0,
        };
      }

      function getGreenhouseSeparateOptions(tempMin) {
        const isExtremeCold = tempMin <= -76;

        return {
          weatherTag: isExtremeCold
            ? `Freezing Night (${tempMin}°C)`
            : `Chilly Night (${tempMin}°C)`,
          tempOptions: isExtremeCold
            ? [
                {
                  id: 'TEMP_ECO',
                  title: 'Warm Blanket Cover',
                  powerCost: 4,
                  minGain: 1,
                  maxGain: 2,
                  desc: 'Keeps plants safe from freezing while saving power.',
                },
                {
                  id: 'TEMP_WARM',
                  title: 'Big Heater + Bright Lamps',
                  powerCost: 11,
                  minGain: 2,
                  maxGain: 4,
                  desc: 'Super warm and bright—helps tomatoes grow super fast!',
                },
              ]
            : [
                {
                  id: 'TEMP_ECO',
                  title: 'Cozy Low Heat',
                  powerCost: 3,
                  minGain: 1,
                  maxGain: 2,
                  desc: 'Keeps a nice room temperature and saves power.',
                },
                {
                  id: 'TEMP_WARM',
                  title: 'Bright Sun Lamps',
                  powerCost: 8,
                  minGain: 2,
                  maxGain: 4,
                  desc: 'Gives plants extra light to grow much faster!',
                },
              ],
          waterOptions: [
            {
              id: 'WATER_LIGHT',
              title: 'Light Water Spray',
              waterCost: 4,
              minGain: 1,
              maxGain: 2,
              desc: 'Gives just enough water to save our water tank.',
            },
            {
              id: 'WATER_RICH',
              title: 'Full Water + Plant Food',
              waterCost: 8,
              minGain: 2,
              maxGain: 4,
              desc: 'Gives lots of water and vitamins for big growth!',
            },
          ],
        };
      }

      function rollRange(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      function calculateTomatoGrowthFromSeparateCare(tempOpt, waterOpt) {
        if (!tempOpt && !waterOpt) {
          return { gain: 0, note: 'No heat or water given today—tomatoes stayed the same size (+0).' };
        }
        if (!tempOpt && waterOpt) {
          const g = rollRange(waterOpt.minGain, waterOpt.maxGain);
          return {
            gain: g,
            note: `Watered without heat—plants grew a little in the cold (+${g} growth).`,
          };
        }
        if (tempOpt && !waterOpt) {
          const g = rollRange(tempOpt.minGain, tempOpt.maxGain);
          return {
            gain: g,
            note: `Heated without water—thirsty plants grew a little (+${g} growth).`,
          };
        }

        const heatRoll = rollRange(tempOpt.minGain, tempOpt.maxGain);
        const waterRoll = rollRange(waterOpt.minGain, waterOpt.maxGain);
        const luckySprout = Math.random() < 0.25 ? 1 : 0;
        const totalGain = heatRoll + waterRoll + luckySprout;

        return {
          gain: totalGain,
          note: `Warm lamps and water helped tomatoes grow +${totalGain} (out of ${MAX_TOMATO_GROWTH})!`,
        };
      }

      function calculatePlantMiniGameBonus(score) {
        if (score >= 12) {
          return { bonus: 3, grade: 'Super Plant Helper!', desc: 'You caught lots of water and plant food!' };
        }
        if (score >= 7) {
          return { bonus: 2, grade: 'Great Gardener!', desc: 'Nice job helping the tomato plants grow!' };
        }
        if (score >= 3) {
          return { bonus: 1, grade: 'Good Try!', desc: 'A little extra care helped the seedlings.' };
        }
        return { bonus: 0, grade: 'Keep Trying!', desc: 'Missed too many drops—no extra growth boost.' };
      }

      function calculateDailyResourceConsumption(weather, roverStatus) {
        let powerCost = 8;
        const powerReasons = ['Base air & lights (-8)'];

        if (weather.tempMin <= -80) {
          powerCost += 5;
          powerReasons.push(`Super cold ${weather.tempMin}°C extra heater (-5)`);
        } else if (weather.tempMin <= -74) {
          powerCost += 3;
          powerReasons.push(`Cold night ${weather.tempMin}°C heater (-3)`);
        } else {
          powerCost += 1;
          powerReasons.push(`Night cabin warmth (-1)`);
        }

        if (weather.isDustStorm) {
          powerCost += 2;
          powerReasons.push('Dust storm air cleaner (-2)');
        }

        let waterCost = 4;
        const waterReasons = ['Drinking & washing (-4)'];
        if (weather.windSpeedMs >= 8.0) {
          waterCost += 2;
          waterReasons.push('Dry windy air mist (-2)');
        } else if (Math.random() < 0.4) {
          waterCost += 1;
          waterReasons.push('Water filter rinse (-1)');
        }

        // Slightly increased daily food consumption (base 10 instead of 8)
        let foodCost = 10;
        const foodReasons = ['Astronaut meals (-10)'];
        if (roverStatus === 'OUT_ON_MISSION' || weather.isDustStorm) {
          foodCost += 2;
          foodReasons.push('Busy mission extra snack (-2)');
        } else if (Math.random() < 0.5) {
          foodCost += 1;
          foodReasons.push('Space workout snack (-1)');
        }

        let oxygenCost = 10;
        const oxygenReasons = ['Breathing air (-10)'];
        if (weather.radiationLevel >= 4) {
          oxygenCost += 2;
          oxygenReasons.push('High sun rays airlock seal (-2)');
        }

        return {
          powerCost,
          powerReasonText: powerReasons.join(', '),
          waterCost,
          waterReasonText: waterReasons.join(', '),
          foodCost,
          foodReasonText: foodReasons.join(', '),
          oxygenCost,
          oxygenReasonText: oxygenReasons.join(', '),
        };
      }

      function calculateSolarGameReward(caughtCount, isDustStorm) {
        if (caughtCount <= 0) return 0;
        const perLight = isDustStorm ? 1.0 : 1.5;
        const maxCap = isDustStorm ? 13 : 25;
        return Math.min(maxCap, Math.round(caughtCount * perLight));
      }

      function getSolarEfficiencyGrade(caughtCount, isDustStorm) {
        if (caughtCount <= 0) return { label: 'No Sunlight Caught', color: 'text-red-500' };
        const highThreshold = isDustStorm ? 10 : 14;
        const midThreshold = isDustStorm ? 6 : 9;
        if (caughtCount >= highThreshold) return { label: 'Super Sun Catcher!', color: 'text-amber-600' };
        if (caughtCount >= midThreshold) return { label: 'Great Job!', color: 'text-emerald-600' };
        return { label: 'Some Power Saved', color: 'text-sky-600' };
      }

      function getAstronautRank(score) {
        if (score >= 180) return 'Mars Science Champion';
        if (score >= 120) return 'Super Mars Astronaut';
        if (score >= 70) return 'Red Planet Explorer';
        if (score >= 30) return 'Junior Astronaut';
        return 'Space Cadet';
      }

      return {
        rollRoverExplorationByCost,
        evaluateRoverReturnHazard,
        getGreenhouseSeparateOptions,
        calculateTomatoGrowthFromSeparateCare,
        calculatePlantMiniGameBonus,
        calculateDailyResourceConsumption,
        calculateSolarGameReward,
        getSolarEfficiencyGrade,
        getAstronautRank,
      };
    })();

    // =========================================================================
    // [Module 4: Shared UI Components & Visual Cover Page]
    // =========================================================================

    /**
     * Title Cover Page & Visual Icon-Driven Quick Guide
     * - No "Step 1~4" buttons
     * - Includes clear GOAL card explaining the aim is achieving higher science results!
     */
    function TitleCoverPage({ onStartMission }) {
      const guideCards = [
        {
          icon: '🏆',
          badge: 'MISSION GOAL',
          color: 'border-yellow-400 bg-yellow-950/70',
          visualFlow: '🪨 Rare Rocks + 🔬 Science = ⭐ High Score!',
          shortLine: 'Goal: Get the highest science results in 20 days!',
        },
        {
          icon: '⚡',
          badge: 'POWER LAB',
          color: 'border-amber-400 bg-amber-950/60',
          visualFlow: '☀️ Panels → ⚡ Power  |  💧+⚡ → 🫧 Air',
          shortLine: 'Catch sunbeams & make breathable air!',
        },
        {
          icon: '🍅',
          badge: 'GREENHOUSE',
          color: 'border-emerald-400 bg-emerald-950/60',
          visualFlow: '🌡️ Heat + 💧 Water + 🎮 Game → 🍅 10/10',
          shortLine: 'Grow red tomatoes & pick before they dry!',
        },
        {
          icon: '🛸',
          badge: 'ROVER & SUPPLY',
          color: 'border-sky-400 bg-sky-950/60',
          visualFlow: '🔋 1–3 Bars → 🚀 Rover  |  🚀 Day 10 Supply',
          shortLine: 'Send rover out to hunt rare Mars rocks!',
        },
      ];

      return (
        <div className="min-h-screen bg-[#070b14] text-white flex flex-col justify-between relative overflow-hidden">
          {/* Starfield + Mars Globe Backdrop */}
          <svg
            viewBox="0 0 1200 700"
            preserveAspectRatio="xMidYMid slice"
            className="inset-0 absolute w-full h-full pointer-events-none"
          >
            <defs>
              <radialGradient id="marsSphere" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stopColor="#f39c6b" />
                <stop offset="45%" stopColor="#d96b38" />
                <stop offset="82%" stopColor="#8c3518" />
                <stop offset="100%" stopColor="#2e0f07" />
              </radialGradient>

    // =========================================================================
    // [Module 5A: Solar Catch Mini-Game Modal]
    // =========================================================================
    function SolarMiniGameModal({ isDustStorm, onComplete, onClose }) {
      const GAME_DURATION = 10;
      const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
      const [panelX, setPanelX] = useState(50);
      const [caughtCount, setCaughtCount] = useState(0);
      const [panelFlash, setPanelFlash] = useState(false);
      const [beams, setBeams] = useState([]);
      const [finished, setFinished] = useState(false);

      const panelXRef = useRef(50);
      const caughtRef = useRef(0);
      const arenaRef = useRef(null);

      const updatePanelFromClientX = (clientX) => {
        if (!arenaRef.current || finished) return;
        const rect = arenaRef.current.getBoundingClientRect();
        const relX = ((clientX - rect.left) / rect.width) * 100;
        const clamped = Math.max(12, Math.min(88, relX));
        panelXRef.current = clamped;
        setPanelX(clamped);
      };

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setFinished(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (finished) return;

        const spawnInterval = setInterval(() => {
          const id = Math.random().toString(36).slice(2);
          const startX = 10 + Math.random() * 80;
          const speed = isDustStorm ? 2.5 : 3.3;
          setBeams((prev) => [...prev, { id, x: startX, y: 0, speed }]);
        }, isDustStorm ? 680 : 480);

        const loop = setInterval(() => {
          setBeams((prev) => {
            const next = [];
            for (const b of prev) {
              const nextY = b.y + b.speed;
              if (nextY >= 80 && nextY <= 91 && Math.abs(b.x - panelXRef.current) <= 13) {
                caughtRef.current += 1;
                setCaughtCount(caughtRef.current);
                setPanelFlash(true);
                setTimeout(() => setPanelFlash(false), 120);
              } else if (nextY < 100) {
                next.push({ ...b, y: nextY });
              }
            }
            return next;
          });
        }, 33);

        return () => {
          clearInterval(spawnInterval);
          clearInterval(loop);
        };
      }, [finished, isDustStorm]);

      const livePowerPreview = GameLogicModule.calculateSolarGameReward(caughtCount, isDustStorm);
      const gradeInfo = GameLogicModule.getSolarEfficiencyGrade(caughtCount, isDustStorm);

      return (
        <div className="fixed inset-0 bg-[#2d1e12]/75 flex items-center justify-center p-4 z-50">
          <div className="bg-[#fdf6e9] border-4 border-[#d9c2a3] rounded-3xl max-w-lg w-full p-5 space-y-3 shadow-2xl">
            <div className="flex flex-wrap justify-between items-center gap-1 text-xs">
              <span className="font-black text-amber-800 text-sm">
                ☀️ Move the Solar Panel to Catch Sunbeams!
              </span>
              <div className="flex items-center gap-2 font-bold">
                <span className="text-[#6b4c35]">{timeLeft}s left</span>
                <span className="px-2.5 py-0.5 rounded-full bg-amber-300 text-amber-950 font-black">
                  Power: +{livePowerPreview} ⚡
                </span>
              </div>
            </div>

            <div
              ref={arenaRef}
              onMouseMove={(e) => updatePanelFromClientX(e.clientX)}
              onTouchMove={(e) => updatePanelFromClientX(e.touches[0].clientX)}
              onClick={(e) => updatePanelFromClientX(e.clientX)}
              className={`relative w-full h-56 rounded-2xl overflow-hidden border-2 cursor-pointer ${
                isDustStorm
                  ? 'bg-gradient-to-b from-amber-700 to-stone-800 border-amber-600'
                  : 'bg-gradient-to-b from-sky-600 to-indigo-900 border-sky-400'
              }`}
            >
              {isDustStorm && (
                <div className="top-2 left-2 absolute text-[11px] bg-amber-100/95 text-amber-900 font-bold px-2.5 py-0.5 rounded-full">
                  🌪️ Dust storm blocks the sun—less power today!
                </div>
              )}

              {beams.map((b) => (
                <div
                  key={b.id}
                  style={{ left: `${b.x}%`, top: `${b.y}%` }}
                  className="-translate-x-1/2 -translate-y-1/2 absolute text-2xl drop-shadow-[0_0_8px_rgba(253,224,71,0.95)] pointer-events-none"
                >
                  ☀️
                </div>
              ))}

              <div
                style={{ left: `${panelX}%` }}
                className={`-translate-x-1/2 bottom-3 absolute w-24 h-5 rounded-lg border-2 flex items-center justify-center text-[11px] font-black pointer-events-none transition-transform duration-75 ${
                  panelFlash
                    ? 'bg-yellow-300 border-white text-slate-900 scale-110 shadow-[0_0_16px_rgba(253,224,71,1)]'
                    : 'bg-sky-400 border-white text-slate-950 shadow-md'
                }`}
              >
                Solar Panel
              </div>

              {finished && (
                <div className="inset-0 absolute bg-[#2d1e12]/85 flex flex-col items-center justify-center p-4 text-center space-y-2">
                  <div className="text-xs font-bold text-amber-100">
                    You caught {caughtCount} sunbeams!
                  </div>
                  <div className={`text-base font-black bg-white px-3 py-0.5 rounded-full ${gradeInfo.color}`}>
                    {gradeInfo.label}
                  </div>
                  <div className="text-2xl font-black text-yellow-300">
                    Power Made: +{livePowerPreview} ⚡
                  </div>
                  <button
                    onClick={() => onComplete(caughtCount)}
                    className="px-6 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-[#3b2514] font-black text-sm shadow-lg"
                  >
                    Save Power to Base!
                  </button>
                </div>
              )}
            </div>

            {!finished && (
              <div className="flex justify-between items-center text-xs text-[#7a5a40]">
                <span>Slide or tap anywhere to move the panel!</span>
                <button onClick={onClose} className="underline font-bold">
                  Cancel
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // [Module 5B: Greenhouse Plant Care Mini-Game Modal]
    // =========================================================================
    function PlantCareMiniGameModal({ onComplete, onClose }) {
      const GAME_DURATION = 10;
      const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
      const [score, setScore] = useState(0);
      const [items, setItems] = useState([]);
      const [finished, setFinished] = useState(false);
      const scoreRef = useRef(0);

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setFinished(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (finished) return;

        const spawn = setInterval(() => {
          const id = Math.random().toString(36).slice(2);
          const isPest = Math.random() < 0.25;
          const x = 14 + Math.random() * 72;
          const y = 18 + Math.random() * 64;
          const icon = isPest ? '🐛' : Math.random() < 0.5 ? '💧' : '✨';
          setItems((prev) => [...prev.slice(-7), { id, x, y, isPest, icon, born: Date.now() }]);
        }, 550);

        const cleanup = setInterval(() => {
          const now = Date.now();
          setItems((prev) => prev.filter((item) => now - item.born < 1700));
        }, 250);

        return () => {
          clearInterval(spawn);
          clearInterval(cleanup);
        };
      }, [finished]);

      const handleTapItem = (item) => {
        if (finished) return;
        setItems((prev) => prev.filter((i) => i.id !== item.id));
        if (item.isPest) {
          scoreRef.current = Math.max(0, scoreRef.current - 1);
        } else {
          scoreRef.current += 1;
        }
        setScore(scoreRef.current);
      };

      const rewardInfo = GameLogicModule.calculatePlantMiniGameBonus(score);

      return (
        <div className="fixed inset-0 bg-[#2d1e12]/75 flex items-center justify-center p-4 z-50">
          <div className="bg-[#fdf6e9] border-4 border-[#d9c2a3] rounded-3xl max-w-lg w-full p-5 space-y-3 shadow-2xl">
            <div className="flex flex-wrap justify-between items-center gap-1 text-xs">
              <span className="font-black text-emerald-800 text-sm">
                🌱 Tap Water (💧) & Plant Food (✨)! Do Not Tap Bugs (🐛)!
              </span>
              <div className="flex items-center gap-2 font-bold">
                <span className="text-[#6b4c35]">{timeLeft}s left</span>
                <span className="px-2.5 py-0.5 rounded-full bg-emerald-200 text-emerald-950 font-black">
                  Score: {score}
                </span>
              </div>
            </div>

            <div className="relative w-full h-56 rounded-2xl overflow-hidden border-2 border-emerald-400 bg-gradient-to-b from-emerald-100 to-amber-100">
              <div className="inset-x-0 bottom-0 h-14 bg-[#8c5832] border-t-4 border-[#5e3a1e] flex items-center justify-center text-xs font-black text-amber-100">
                Tomato Planter Box
              </div>

              {items.map((item) => (
                <button
                  key={item.id}
                  onClick={() => handleTapItem(item)}
                  style={{ left: `${item.x}%`, top: `${item.y}%` }}
                  className="-translate-x-1/2 -translate-y-1/2 absolute w-12 h-12 rounded-full bg-white/90 border-2 border-emerald-500 shadow-md flex items-center justify-center text-2xl active:scale-90 transition cursor-pointer"
                >
                  {item.icon}
                </button>
              ))}

              {finished && (
                <div className="inset-0 absolute bg-[#2d1e12]/85 flex flex-col items-center justify-center p-4 text-center space-y-2">
                  <div className="text-xs font-bold text-emerald-100">
                    Your Score: {score} pts
                  </div>
                  <div className="text-base font-black bg-white text-emerald-700 px-3 py-0.5 rounded-full">
                    {rewardInfo.grade}
                  </div>
                  <div className="text-2xl font-black text-lime-300">
                    Extra Growth: +{rewardInfo.bonus} / {MAX_TOMATO_GROWTH}
                  </div>
                  <p className="text-xs text-amber-100">{rewardInfo.desc}</p>
                  <button
                    onClick={() => onComplete(score)}
                    className="px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-black text-sm shadow-lg"
                  >
                    Help Tomatoes Grow!
                  </button>
                </div>
              )}
            </div>

            {!finished && (
              <div className="flex justify-between items-center text-xs text-[#7a5a40]">
                <span>Higher scores give +1, +2, or +3 tomato growth right away!</span>
                <button onClick={onClose} className="underline font-bold">
                  Cancel
                </button>
              </div>
            )}
          </div>
        </div>
      );

            <div className="bg-white/95 border-2 border-[#d9c2a3] px-3 py-1 rounded-full text-xs font-black text-[#5a3e28] shadow">

          {hasHighRisk && roverStatus === 'READY' && (
            <div className="top-13 left-4 right-4 absolute bg-red-100/95 border-2 border-red-400 text-red-900 px-3 py-1 rounded-full text-xs font-extrabold shadow text-center z-20 truncate">

              style={{ left: '30%', top: '36%', width: '38%', height: '52%' }}

    // =========================================================================
    // [Module 11: Main App Controller]
    // =========================================================================
    function App() {
      const [showCoverPage, setShowCoverPage] = useState(true);
      const [sol, setSol] = useState(1);
      const [secondsLeftInDay, setSecondsLeftInDay] = useState(DAY_DURATION_SECONDS);
      const [resources, setResources] = useState(INITIAL_RESOURCES);

      const [currentScene, setCurrentScene] = useState('EXTERIOR');
      const [showSolarGameModal, setShowSolarGameModal] = useState(false);
      const [showPlantMiniGameModal, setShowPlantMiniGameModal] = useState(false);

      const [solarCollectedToday, setSolarCollectedToday] = useState(false);
      const [todayTempOption, setTodayTempOption] = useState(null);
      const [todayWaterOption, setTodayWaterOption] = useState(null);
      const [plantMiniGamePlayedToday, setPlantMiniGamePlayedToday] = useState(false);

      const [tomatoProgress, setTomatoProgress] = useState(2);
      const [tomatoSpoiledToday, setTomatoSpoiledToday] = useState(false);
      const [harvestCount, setHarvestCount] = useState(0);

      const [batteryBars, setBatteryBars] = useState(4);
      const [roverStatus, setRoverStatus] = useState('READY');
      const [damageSolLeft, setDamageSolLeft] = useState(0);
      const [pendingExpedition, setPendingExpedition] = useState(null);

      const [totalMissions, setTotalMissions] = useState(0);
      const [deepDrillMissions, setDeepDrillMissions] = useState(0);
      const [braveMissions, setBraveMissions] = useState(0);
      const [dustStormSurvived, setDustStormSurvived] = useState(0);
      const [perfectSolarGames, setPerfectSolarGames] = useState(0);

      const [samples, setSamples] = useState({
        BASALT: 0,
        IRON_OXIDE: 0,
        HYDRATED: 0,
        SPECIAL_GEO: 0,
        ANCIENT_BIOSIGNATURE: 0,
        NONE: 0,
      });

      const [expeditionLogs, setExpeditionLogs] = useState([]);
      const [dailyPhotoAlbum, setDailyPhotoAlbum] = useState([]);
      const [yesterdayReport, setYesterdayReport] = useState(null);
      const [yesterdayConsumption, setYesterdayConsumption] = useState(null);

      const [usedPhotoIds, setUsedPhotoIds] = useState(new Set());
      const [weather, setWeather] = useState(null);
      const [loadingNasa, setLoadingNasa] = useState(true);

      const [showMorningBriefing, setShowMorningBriefing] = useState(true);
      const [dailyReport, setDailyReport] = useState([]);
      const [pendingConfirmAction, setPendingConfirmAction] = useState(null);
      const [ending, setEnding] = useState(null);
      const [abortReason, setAbortReason] = useState('');

      const executeEndSolRef = useRef(null);

      const elapsedSeconds = DAY_DURATION_SECONDS - secondsLeftInDay;
      const nightFactor = Math.max(0, Math.min(1, elapsedSeconds / DAY_DURATION_SECONDS));
      const isNightPhase = nightFactor >= 0.55;

      const loadWeatherForSol = async (targetSol) => {
        setLoadingNasa(true);
        const env = await NasaService.generateDailyMarsEnvironment(targetSol);
        setWeather(env);
        setLoadingNasa(false);
        setShowMorningBriefing(true);
      };

      useEffect(() => {
        loadWeatherForSol(1);
      }, []);

      const totalScore = SAMPLE_CATALOG.reduce((sum, item) => {
        if (item.id === 'NONE' || item.id === 'ANCIENT_BIOSIGNATURE') return sum;
        return sum + samples[item.id] * item.points;
      }, 0);

      const showPowerDot = !solarCollectedToday;
      const showGreenhouseDot =
        tomatoProgress >= MAX_TOMATO_GROWTH ||
        ((!todayTempOption || !todayWaterOption || !plantMiniGamePlayedToday) && tomatoProgress < MAX_TOMATO_GROWTH);
      const showRoverDot = roverStatus === 'READY' && !pendingExpedition && batteryBars >= 1;

      const handleCompleteSolarGame = (caughtCount) => {
        const gainedPower = GameLogicModule.calculateSolarGameReward(caughtCount, weather?.isDustStorm);
        setShowSolarGameModal(false);
        setResources((r) => ({ ...r, power: Math.min(100, r.power + gainedPower) }));
        setSolarCollectedToday(true);
        if (caughtCount >= 14) setPerfectSolarGames((c) => c + 1);
        const msg = gainedPower > 0
          ? `☀️ Caught ${caughtCount} sunbeams and made +${gainedPower} Power!`
          : `⚠️ Missed all sunbeams—no power made.`;
        setDailyReport((prev) => [...prev, msg]);
      };

      const handleCompletePlantMiniGame = (score) => {
        const reward = GameLogicModule.calculatePlantMiniGameBonus(score);
        setShowPlantMiniGameModal(false);
        setTomatoProgress((p) => Math.min(MAX_TOMATO_GROWTH, p + reward.bonus));
        setPlantMiniGamePlayedToday(true);
        setDailyReport((prev) => [
          ...prev,
          `🌱 Plant mini-game scored ${score} pts (+${reward.bonus} Tomato Growth)!`,
        ]);
      };

      const handleRequestElectrolysis = () => {
        if (resources.water < 10 || resources.power < 15) return;
        setPendingConfirmAction({
          icon: '🫧',
          title: 'Make Breathable Air (Oxygen)',
          costText: '-10 💧 Water, -15 ⚡ Power',
          gainText: '+22 🫧 Air (Oxygen)',
          note: 'Turn water into breathable air using electricity?',
          onExecute: () => {
            setResources((r) => ({
              ...r,
              water: Math.max(0, r.water - 10),
              power: Math.max(0, r.power - 15),
              oxygen: Math.min(100, r.oxygen + 22),
            }));
            setDailyReport((prev) => [...prev, '🫧 Air machine ran: -10 Water, -15 Power → +22 Air!']);
          },
        });
      };

      const handleRequestChargeRover = () => {
        if (resources.power < 12 || batteryBars >= 5 || roverStatus === 'OUT_ON_MISSION') return;
        setPendingConfirmAction({
          icon: '🔋',
          title: 'Charge Rover Battery',
          costText: '-12 ⚡ Power',
          gainText: `+1 Battery Bar (${batteryBars + 1}/5)`,
          note: 'Fill up 1 battery bar for the rover?',
          onExecute: () => {
            setResources((r) => ({ ...r, power: Math.max(0, r.power - 12) }));
            setBatteryBars((b) => Math.min(5, b + 1));
            setDailyReport((prev) => [...prev, `🔋 Charged Rover +1 Bar (-12 Power, now ${batteryBars + 1}/5)!`]);
          },
        });
      };

      const handleRequestSelectTempOption = (opt) => {
        if (todayTempOption || tomatoProgress >= MAX_TOMATO_GROWTH || resources.power < opt.powerCost) return;
        setPendingConfirmAction({
          icon: '🌡️',
          title: `Greenhouse Heat: ${opt.title}`,
          costText: `-${opt.powerCost} ⚡ Power`,
          gainText: 'Keeps plants warm overnight',
          note: opt.desc,
          onExecute: () => {
            setResources((r) => ({ ...r, power: Math.max(0, r.power - opt.powerCost) }));
            setTodayTempOption(opt);
            setTomatoSpoiledToday(false);
            setDailyReport((prev) => [...prev, `🌡️ Turned on "${opt.title}" (-${opt.powerCost} Power).`]);
          },
        });
      };

      const handleRequestSelectWaterOption = (opt) => {
        if (todayWaterOption || tomatoProgress >= MAX_TOMATO_GROWTH || resources.water < opt.waterCost) return;
        setPendingConfirmAction({
          icon: '💧',
          title: `Greenhouse Water: ${opt.title}`,
          costText: `-${opt.waterCost} 💧 Water`,
          gainText: 'Waters tomato roots overnight',
          note: opt.desc,
          onExecute: () => {
            setResources((r) => ({ ...r, water: Math.max(0, r.water - opt.waterCost) }));
            setTodayWaterOption(opt);
            setTomatoSpoiledToday(false);
            setDailyReport((prev) => [...prev, `💧 Turned on "${opt.title}" (-${opt.waterCost} Water).`]);
          },
        });
      };

      const handleRequestHarvestTomato = (onAnimationTrigger) => {
        if (tomatoProgress < MAX_TOMATO_GROWTH) return;
        setPendingConfirmAction({
          icon: '🍅',
          title: 'Pick Ripe Red Tomatoes',
          costText: 'None',
          gainText: `+${TOMATO_HARVEST_FOOD_GAIN} 🍅 Food (and plants new baby seeds)`,
          note: 'Put all ripe tomatoes into the basket?',
          onExecute: () => {
            setResources((r) => ({ ...r, food: Math.min(100, r.food + TOMATO_HARVEST_FOOD_GAIN) }));
            setTomatoProgress(0);
            setHarvestCount((c) => c + 1);
            setDailyReport((prev) => [...prev, `🧺 Picked ripe tomatoes! +${TOMATO_HARVEST_FOOD_GAIN} Food added!`]);
            if (onAnimationTrigger) onAnimationTrigger();
          },
        });
      };

      const handleRequestDispatchRover = (barsCost) => {
        if (pendingExpedition || roverStatus !== 'READY' || batteryBars < barsCost || !weather) return;
        const mode = ROVER_DISPATCH_MODES[barsCost];
        setPendingConfirmAction({
          icon: '🚀',
          title: `Send Rover: ${mode.name}`,
          costText: `-${barsCost} Rover Battery (${batteryBars - barsCost}/5 left)`,
          gainText: `Rover drives outside window & returns Day ${sol + 1} with rocks!`,
          note: mode.desc,
          onExecute: () => {
            if (barsCost === 3) setDeepDrillMissions((c) => c + 1);
            const remaining = Math.max(0, batteryBars - barsCost);
            setBatteryBars(remaining);
            setRoverStatus('OUT_ON_MISSION');
            setTotalMissions((m) => m + 1);

            setPendingExpedition({
              dispatchedSol: sol,
              barsCost,
              remainingBars: remaining,
              isDustStorm: weather.isDustStorm,
              radiationLevel: weather.radiationLevel,
            });

            setDailyReport((prev) => [
              ...prev,
              `🛸 Rover drove out (-${barsCost} battery)! Check the window to see it exploring!`,
            ]);
          },
        });
      };

      const handleRequestEndSol = () => {
        if (!weather || ending) return;
        setPendingConfirmAction({
          icon: '🌙',
          title: `Sleep & End Day ${sol}?`,
          costText: null,
          gainText: `Moves to Day ${sol + 1} and checks plants & rover`,
          note: 'Ready to finish today and go to sleep?',
          onExecute: () => {
            executeEndSol();
          },
        });
      };

      const executeEndSol = async () => {
        if (!weather || ending) return;
        setPendingConfirmAction(null);
        setShowSolarGameModal(false);
        setShowPlantMiniGameModal(false);

        const logs = [];

        if (!solarCollectedToday) {
          logs.push('⚠️ Forgot to collect solar power today—backup panel saved +4 Power.');
        }
        const passiveSolar = solarCollectedToday ? 0 : 4;

        if (weather.isDustStorm) {
          setDustStormSurvived((c) => c + 1);
        }

        const consumption = GameLogicModule.calculateDailyResourceConsumption(weather, roverStatus);

        const nextPower = Math.min(100, Math.max(0, resources.power + passiveSolar - consumption.powerCost));
        const nextOxygen = Math.min(100, Math.max(0, resources.oxygen - consumption.oxygenCost));
        const nextWater = Math.min(100, Math.max(0, resources.water - consumption.waterCost));
        const nextFood = Math.min(100, Math.max(0, resources.food - consumption.foodCost));

        let nextTomatoProgress = tomatoProgress;
        let spoiledFlag = false;

        if (tomatoProgress >= MAX_TOMATO_GROWTH) {
          nextTomatoProgress = 0;
          spoiledFlag = true;
          logs.push('Ripe tomatoes dried up unpicked overnight—new seedlings sprouted!');
        } else {
          const growthResult = GameLogicModule.calculateTomatoGrowthFromSeparateCare(todayTempOption, todayWaterOption);
          nextTomatoProgress = Math.min(MAX_TOMATO_GROWTH, tomatoProgress + growthResult.gain);
          if (nextTomatoProgress >= MAX_TOMATO_GROWTH) {
            logs.push(`🍅 Tomatoes reached ${MAX_TOMATO_GROWTH}/${MAX_TOMATO_GROWTH} full ripeness! Pick them tomorrow!`);
          } else {
            logs.push(growthResult.note);
          }
        }

        if (nextOxygen <= 0 || nextWater <= 0 || nextFood <= 0) {
          const reason =
            nextOxygen <= 0 ? 'Ran out of air (oxygen)' : nextWater <= 0 ? 'Ran out of water' : 'Ran out of food';
          setResources({ oxygen: nextOxygen, power: nextPower, water: nextWater, food: nextFood });
          setAbortReason(reason);
          setEnding('EMERGENCY_ABORT');
          return;
        }

        let generatedYesterdayReport = null;
        let nextRoverStatus = roverStatus;
        let nextDamageLeft = damageSolLeft;

        if (pendingExpedition) {
          const photo = await NasaService.fetchNextCuriosityPhoto(usedPhotoIds);
          setUsedPhotoIds((prev) => new Set(prev).add(photo.id));
          setDailyPhotoAlbum((prev) => [...prev, { sol: pendingExpedition.dispatchedSol, photo }]);

          const hazardEval = GameLogicModule.evaluateRoverReturnHazard(
            pendingExpedition.isDustStorm,
            pendingExpedition.radiationLevel
          );

          if (hazardEval.isDamaged) {
            nextRoverStatus = hazardEval.damagedSols === 2 ? 'DAMAGED_2_SOL' : 'DAMAGED_1_SOL';
            nextDamageLeft = hazardEval.damagedSols;
            generatedYesterdayReport = {
              sol: pendingExpedition.dispatchedSol,
              damagedSols: hazardEval.damagedSols,
              damageReason: hazardEval.reasonText,
              photo,
              sample: null,
            };
          } else {
            if (hazardEval.wasHazardous) setBraveMissions((b) => b + 1);
            nextRoverStatus = 'READY';
            const found = GameLogicModule.rollRoverExplorationByCost(pendingExpedition.barsCost);
            setSamples((prev) => ({ ...prev, [found.id]: prev[found.id] + 1 }));

            const record = {
              sol: pendingExpedition.dispatchedSol,
              damagedSols: 0,
              damageReason: '',
              photo,
              sample: found,
            };
            setExpeditionLogs((prev) => [...prev, record]);
            generatedYesterdayReport = record;

            if (found.id === 'ANCIENT_BIOSIGNATURE') {
              setResources({ oxygen: nextOxygen, power: nextPower, water: nextWater, food: nextFood });
              setEnding('SPECIAL_DISCOVERY');
              return;
            }
          }
          setPendingExpedition(null);
        } else if (damageSolLeft > 0) {
          nextDamageLeft = damageSolLeft - 1;
          if (nextDamageLeft === 0) {
            nextRoverStatus = 'READY';
            logs.push('🛠️ Rover repairs finished! Ready to explore again.');
          }
        }

        if (sol >= 20) {
          setResources({ oxygen: nextOxygen, power: nextPower, water: nextWater, food: nextFood });
          setEnding('NORMAL_20_SOL');
          return;
        }

        const nextSol = sol + 1;
        let finalWater = nextWater;
        let finalFood = nextFood;

        if (nextSol === 10) {
          finalWater = 100;
          finalFood = 100;
          logs.push('📦 [Day 10 Supply Rocket Landed!] Water and Food refilled to 100!');
        }

        setResources({ oxygen: nextOxygen, power: nextPower, water: finalWater, food: finalFood });
        setTomatoProgress(nextTomatoProgress);
        setTomatoSpoiledToday(spoiledFlag);
        setRoverStatus(nextRoverStatus);
        setDamageSolLeft(nextDamageLeft);
        setYesterdayReport(generatedYesterdayReport);
        setYesterdayConsumption(consumption);
        setSol(nextSol);
        setSecondsLeftInDay(DAY_DURATION_SECONDS);
        setSolarCollectedToday(false);
        setTodayTempOption(null);
        setTodayWaterOption(null);
        setPlantMiniGamePlayedToday(false);
        setDailyReport(logs);
        setCurrentScene('EXTERIOR');
        await loadWeatherForSol(nextSol);
      };

      executeEndSolRef.current = executeEndSol;

      useEffect(() => {
        if (showCoverPage || ending || showMorningBriefing || loadingNasa) return;
        const interval = setInterval(() => {
          setSecondsLeftInDay((prev) => {
            if (prev <= 1) {
              if (executeEndSolRef.current) executeEndSolRef.current();
              return DAY_DURATION_SECONDS;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [showCoverPage, ending, showMorningBriefing, loadingNasa]);

      const handleRestart = () => {
        setSol(1);
        setSecondsLeftInDay(DAY_DURATION_SECONDS);
        setResources(INITIAL_RESOURCES);
        setCurrentScene('EXTERIOR');
        setSolarCollectedToday(false);
        setTodayTempOption(null);
        setTodayWaterOption(null);
        setPlantMiniGamePlayedToday(false);
        setTomatoProgress(2);
        setTomatoSpoiledToday(false);
        setHarvestCount(0);
        setBatteryBars(4);
        setRoverStatus('READY');
        setDamageSolLeft(0);
        setPendingExpedition(null);
        setTotalMissions(0);
        setDeepDrillMissions(0);
        setBraveMissions(0);
        setDustStormSurvived(0);
        setPerfectSolarGames(0);
        setSamples({
          BASALT: 0,
          IRON_OXIDE: 0,
          HYDRATED: 0,
          SPECIAL_GEO: 0,
          ANCIENT_BIOSIGNATURE: 0,
          NONE: 0,
        });
        setExpeditionLogs([]);
        setDailyPhotoAlbum([]);
        setYesterdayReport(null);
        setYesterdayConsumption(null);
        setUsedPhotoIds(new Set());
        setDailyReport([]);
        setPendingConfirmAction(null);
        setEnding(null);
        setAbortReason('');
        setShowCoverPage(true);
        loadWeatherForSol(1);
      };

      if (showCoverPage) {
        return (
          <TitleCoverPage
            onStartMission={() => {
              setShowCoverPage(false);
              setShowMorningBriefing(true);
            }}
          />
        );
      }

      if (ending) {
        const unlockedBadges = [];
        if (sol >= 20 && ending !== 'EMERGENCY_ABORT') unlockedBadges.push({ icon: '🏅', title: 'Mars Survival Hero', desc: 'Lived all 20 days on Mars' });
        if (totalMissions >= 10) unlockedBadges.push({ icon: '🛸', title: 'Junior Explorer', desc: 'Sent the rover out 10+ times' });
        if (deepDrillMissions >= 3) unlockedBadges.push({ icon: '⚡', title: 'Deep Dig Pro', desc: 'Did 3+ far 3-battery rover trips' });
        if (perfectSolarGames >= 3) unlockedBadges.push({ icon: '☀️', title: 'Super Sun Catcher', desc: 'Caught 14+ sunbeams 3+ times' });
        if (harvestCount >= 2) unlockedBadges.push({ icon: '🍅', title: 'Mars Gardener', desc: 'Picked 2+ crops of ripe tomatoes' });
        if (harvestCount >= 4) unlockedBadges.push({ icon: '🧺', title: 'Master Tomato Farmer', desc: 'Picked 4+ crops of ripe tomatoes' });
        if (braveMissions >= 1) unlockedBadges.push({ icon: '☢️', title: 'Brave Storm Explorer', desc: 'Finished a rover trip during bad weather' });
        if (samples.BASALT > 0 && samples.IRON_OXIDE > 0 && samples.HYDRATED > 0 && samples.SPECIAL_GEO > 0) {
          unlockedBadges.push({ icon: '🪨', title: 'Rock Collector Pro', desc: 'Found all 4 main kinds of Mars rocks' });
        }
        if (dustStormSurvived >= 3 && ending !== 'EMERGENCY_ABORT') {
          unlockedBadges.push({ icon: '🌪️', title: 'Dust Storm Survivor', desc: 'Made it through 3+ big dust storms' });
        }
        if (ending === 'SPECIAL_DISCOVERY') {
          unlockedBadges.push({ icon: '🌟', title: 'Life-Clue Champion', desc: 'Found the mystery life-clue rock on Mars' });
        }

        return (
          <EndGameModule
            ending={ending}
            abortReason={abortReason}
            sol={sol}
            totalScore={totalScore}
            samples={samples}
            expeditionLogs={expeditionLogs}
            dailyPhotoAlbum={dailyPhotoAlbum}
            unlockedBadges={unlockedBadges}
            onRestart={handleRestart}
          />
        );
      }

      const radInfo = RADIATION_LABELS[weather?.radiationLevel || 1];
      const mins = Math.floor(secondsLeftInDay / 60);
      const secs = String(secondsLeftInDay % 60).padStart(2, '0');

      return (
        <div className="min-h-screen bg-[#fdf6e9] text-[#4a3525] flex flex-col">
          {/* Top Header: Row 1 = Day/Timer + News/Guide + Weather (no pt display), Row 2 = Full-width 4 Resource Bars */}
          <header className="px-3 md:px-6 pt-3 pb-2 max-w-5xl w-full mx-auto space-y-2">
            {/* Row 1 */}
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div className="bg-white border-2 border-[#e6d5bc] rounded-2xl px-3.5 py-1.5 shadow-sm flex items-center gap-2">
                  <span className="text-base">{isNightPhase ? '🌙' : '☀️'}</span>
                  <span className="font-black text-sm md:text-base text-[#4a3525]">Day {sol}/20</span>
                  <span className={`px-2 py-0.5 rounded-lg text-xs font-black ${isNightPhase ? 'bg-indigo-900 text-amber-200' : 'bg-amber-100 text-amber-900'}`}>
                    {mins}:{secs}
                  </span>
                </div>
                <button
                  onClick={() => setShowMorningBriefing(true)}
                  className="bg-amber-200 hover:bg-amber-300 border-2 border-amber-400 rounded-2xl px-3 py-1.5 text-xs font-black text-amber-950 shadow-sm"
                >
                  📋 News
                </button>
                <button
                  onClick={() => setShowCoverPage(true)}
                  className="bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-2xl px-3 py-1.5 text-xs font-black shadow-sm"
                >
                  ❓ Guide
                </button>
              </div>

              {weather && (
                <div className="bg-white border-2 border-[#e6d5bc] rounded-2xl px-3.5 py-1.5 shadow-sm flex items-center gap-2 text-xs font-bold">
                  <span>{weather.isDustStorm ? '🌪️ Dust Storm' : '🌤️ Clear'}</span>
                  <span className={`px-2 py-0.5 rounded-full text-white ${radInfo.color}`}>
                    Rays: {radInfo.text}
                  </span>
                </div>
              )}
            </div>

            {/* Row 2: Dedicated Full-Width Row for 4 Extended Resource Bars */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 w-full items-stretch">
              <TopResourcePill label="Air" value={resources.oxygen} barColor="bg-sky-400" icon="🫧" />
              <TopResourcePill label="Power" value={resources.power} barColor="bg-amber-400" icon="⚡" />
              <TopResourcePill label="Water" value={resources.water} barColor="bg-blue-500" icon="💧" />
              <TopResourcePill label="Food" value={resources.food} barColor="bg-red-500" icon="🍅" />
            </div>
          </header>

          {dailyReport.length > 0 && (
            <div className="max-w-5xl w-full mx-auto px-3 md:px-6 mb-1.5">
              <div className="bg-amber-100 border-2 border-amber-300 rounded-2xl px-4 py-1.5 text-xs md:text-sm font-bold text-amber-950 flex flex-wrap justify-between items-center gap-2">
                <div className="truncate">{dailyReport[dailyReport.length - 1]}</div>
                <span className="text-[11px] text-amber-700 shrink-0">({dailyReport.length} updates)</span>
              </div>
            </div>
          )}

          <main className="flex-1 max-w-5xl w-full mx-auto px-3 md:px-6 pb-5 flex flex-col justify-center">
            {currentScene === 'EXTERIOR' && (
              <BaseExteriorModule
                sol={sol}
                nightFactor={nightFactor}
                tomatoProgress={tomatoProgress}
                showPowerDot={showPowerDot}
                showGreenhouseDot={showGreenhouseDot}
                showRoverDot={showRoverDot}
                onEnterRoom={(room) => setCurrentScene(room)}
                onRequestEndSol={handleRequestEndSol}
              />
            )}

            {currentScene === 'POWER' && (
              <PowerRoomModule
                resources={resources}
                weather={weather}
                nightFactor={nightFactor}
                solarCollectedToday={solarCollectedToday}
                batteryBars={batteryBars}
                roverStatus={roverStatus}
                onBack={() => setCurrentScene('EXTERIOR')}
                onOpenSolarGame={() => setShowSolarGameModal(true)}
                onRequestElectrolysis={handleRequestElectrolysis}
                onRequestChargeRover={handleRequestChargeRover}
              />
            )}

            {currentScene === 'GREENHOUSE' && (
              <GreenhouseRoomModule
                resources={resources}
                weather={weather}
                tomatoProgress={tomatoProgress}
                tomatoSpoiledToday={tomatoSpoiledToday}
                todayTempOption={todayTempOption}
                todayWaterOption={todayWaterOption}
                plantMiniGamePlayedToday={plantMiniGamePlayedToday}
                onBack={() => setCurrentScene('EXTERIOR')}
                onRequestSelectTempOption={handleRequestSelectTempOption}
                onRequestSelectWaterOption={handleRequestSelectWaterOption}
                onOpenPlantMiniGame={() => setShowPlantMiniGameModal(true)}
                onRequestHarvestTomato={handleRequestHarvestTomato}
              />
            )}

            {currentScene === 'ROVER' && (
              <RoverRoomModule
                weather={weather}
                nightFactor={nightFactor}
                batteryBars={batteryBars}
                roverStatus={roverStatus}
                damageSolLeft={damageSolLeft}
                pendingExpedition={pendingExpedition}
                samples={samples}
                onBack={() => setCurrentScene('EXTERIOR')}
                onRequestDispatchRover={handleRequestDispatchRover}
              />
            )}
          </main>

          <ActionConfirmModal
            pendingAction={pendingConfirmAction}
            onConfirm={() => {
              const fn = pendingConfirmAction?.onExecute;
              setPendingConfirmAction(null);
              if (fn) fn();
            }}
            onCancel={() => setPendingConfirmAction(null)}
          />

          {showSolarGameModal && (
            <SolarMiniGameModal
              isDustStorm={weather?.isDustStorm}
              onComplete={handleCompleteSolarGame}
              onClose={() => setShowSolarGameModal(false)}
            />
          )}

          {showPlantMiniGameModal && (
            <PlantCareMiniGameModal
              onComplete={handleCompletePlantMiniGame}
              onClose={() => setShowPlantMiniGameModal(false)}
            />
          )}

          <MorningBriefingModule
            visible={showMorningBriefing && !loadingNasa}
            sol={sol}
            weather={weather}
            yesterdayReport={yesterdayReport}
            yesterdayConsumption={yesterdayConsumption}
            onConfirm={() => setShowMorningBriefing(false)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
