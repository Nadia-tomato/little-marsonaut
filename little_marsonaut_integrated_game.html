<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LITTLE MARSONAUT — 2026 NASA Space Apps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #fdf6e9;
      color: #4a3525;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes tomatoHarvestPop {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      40% { transform: translateY(-50px) scale(1.3) rotate(-6deg); opacity: 1; }
      75% { transform: translateY(-70px) scale(1.15) rotate(4deg); opacity: 0.95; }
      100% { transform: translateY(-90px) scale(0.6); opacity: 0; }
    }
    .animate-tomato-harvest {
      animation: tomatoHarvestPop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatBadge 2.2s ease-in-out infinite;
    }
    @keyframes launch-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes launchFade {
      0%, 88% { opacity: 1; }
      100% { opacity: 0; }
    }
    .animate-launch-fade { animation: launchFade 11.5s ease-in forwards; }
    @keyframes rocketFlight {
      0% { opacity: 0; }
      6% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    .animate-rocket-flight {
      animation: rocketFlight 10.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes thrusterGlow {
      0%, 100% { transform: scaleY(1); opacity: 0.85; }
      50% { transform: scaleY(1.4); opacity: 1; }
    }
    .animate-thruster {
      transform-origin: top center;
      animation: thrusterGlow 0.15s ease-in-out infinite;
    }
    @keyframes orbitPulse {
      0% { stroke-dashoffset: 0; opacity: 0.55; }
      50% { opacity: 0.95; }
      100% { stroke-dashoffset: -36; opacity: 0.55; }
    }
    .animate-orbit-path {
      animation: orbitPulse 3s linear infinite;
    }
    @keyframes waterDropletFall {
      0% { transform: translateY(-12px) scale(0.6); opacity: 0; }
      30% { opacity: 1; }
      80% { transform: translateY(14px) scale(1.1); opacity: 1; }
      100% { transform: translateY(22px) scale(1.4); opacity: 0; }
    }
    .animate-water-drop {
      animation: waterDropletFall 0.65s ease-in forwards;
    }
    @keyframes alertPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .animate-alert-pulse {
      animation: alertPulse 1.1s ease-in-out infinite;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(360px) rotate(260deg); opacity: 0; }
    }
    .confetti-piece { animation: confettiFall 2.4s ease-in forwards; }
    @keyframes roverCruise {
      0% { transform: translate(180px, 195px) scale(0.7, 0.7); opacity: 0; }
      3% { opacity: 1; }
      46% { transform: translate(820px, 195px) scale(0.7, 0.7); opacity: 1; }
      48% { opacity: 0; }
      50% { transform: translate(820px, 195px) scale(-0.7, 0.7); opacity: 0; }
      53% { opacity: 1; }
      96% { transform: translate(180px, 195px) scale(-0.7, 0.7); opacity: 1; }
      98% { opacity: 0; }
      100% { transform: translate(180px, 195px) scale(0.7, 0.7); opacity: 0; }
    }
    .animate-rover-cruise {
      animation: roverCruise 24s linear infinite;
    }
    @keyframes supplyHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-supply-hover {
      animation: supplyHover 2.8s ease-in-out infinite;
    }
    .smooth-sky-grad stop {
      transition: stop-color 1.2s linear;
    }
    .smooth-sky-fill {
      transition: fill 1.2s linear;
    }
    .smooth-dust-fog {
      transition: opacity 1.8s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // [Module 1: Game Constants & Elementary-Friendly English Text]
    // =========================================================================
    const MAX_TOMATO_GROWTH = 10;
    const IS_LOCAL_TEST_HOST = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const TEST_CLOCK_SECONDS = IS_LOCAL_TEST_HOST
      ? Math.max(0, Number(new URLSearchParams(window.location.search).get('testClock')) || 0)
      : 0;
    const DAY_DURATION_SECONDS = TEST_CLOCK_SECONDS || 100; // 1 Sol = 100s (1:40)
    const TOMATO_HARVEST_FOOD_GAIN = 24;
    const ROVER_POWER_PER_BAR = 10;
    const OUR_ROVER_NAME = 'Curiosity Jr.'; // Named after NASA's Curiosity Rover!

    const INITIAL_RESOURCES = {
      oxygen: 70,
      power: 70,
      water: 100,
      food: 60,
    };

    // Elementary-school friendly explanations triggered by Big Question Mark (?) buttons
    const SCIENCE_EXPLANATIONS = {
      SOLAR_POWER: {
        icon: '☀️',
        title: 'How Do Solar Panels Work on Mars?',
        body: 'Solar panels catch sunlight and turn it into electricity for our base! By moving the solar panel, we tilt its angle to face the sun directly and catch the most light. As days go by on Mars, fine red dust settles on the panels, so they make a little less power each day!',
        funTip: 'Tip: In a dust storm, thick clouds of sand block the sun, so we get less power!',
      },
      OXYGEN_ELECTROLYSIS: {
        icon: '🫧',
        title: 'Making Oxygen From Water!',
        body: 'Mars has almost no oxygen to breathe! In our Power Lab, we use electricity to split water into hydrogen gas and oxygen gas. That gives our astronauts fresh air to breathe inside the base!',
        funTip: 'Science Word: Splitting water with electricity is called "Electrolysis"!',
      },
      TOMATO_GROWTH: {
        icon: '🍅',
        title: 'Grow Lights & Warming Our Tomatoes!',
        body: 'Mars is super freezing at night (down to -80°C!), and sunlight is weaker than on Earth. Turning on bright grow lamps and heaters gives our tomato plants the light and warmth they need to make their own food and grow big and red!',
        funTip: 'Remember: Plants need both warm light AND water to grow fast!',
      },
      CURIOSITY_ROVER: {
        icon: '🛸',
        title: `About NASA's Curiosity & Our Rover "${OUR_ROVER_NAME}"!`,
        body: `NASA's real Curiosity rover is a car-sized robot exploring Gale Crater on Mars since 2012! It has 6 wheels, a laser camera head, and a robot arm drill to study rocks and look for signs of ancient water. We named our base rover "${OUR_ROVER_NAME}" because it follows in Curiosity's tracks to explore Mars!`,
        funTip: `Give "${OUR_ROVER_NAME}" more battery power to drive farther and find rarer rocks!`,
      },
    };

    // Rotating Mars facts so every rocket flight shows a different fact!
    const MARS_FACTS = [
      'Did you know? Mars has two small moons shaped like potatoes: Phobos and Deimos!',
      'A day on Mars (called a "Sol") is 24 hours and 39 minutes—just a little longer than a day on Earth!',
      'Mars looks bright red because its dirt and rocks are covered in rusty iron dust!',
      'Mars has the biggest volcano in our solar system: Olympus Mons! It is three times taller than Mount Everest.',
      'Gravity on Mars is much weaker than on Earth. You could jump almost three times higher on Mars!',
      'Mars has a giant canyon called Valles Marineris that is as long as the entire United States!',
      'Billions of years ago, Mars had warm rivers, lakes, and maybe even a big ocean!',
      'Sunsets on Mars look blue instead of orange because fine red dust scatters the sunlight!',
    ];

    const ROVER_DISPATCH_MODES = {
      1: {
        barsCost: 1,
        durationSeconds: 25,
        name: 'Short Walk (10 ⚡)',
        desc: 'Quick trip right outside the garage door. Saves power, fewer rare rocks.',
        discoveryMultiplier: 0.6,
        rareBonus: 0.5,
      },
      2: {
        barsCost: 2,
        durationSeconds: 45,
        name: 'Crater Trip (20 ⚡)',
        desc: 'Medium drive to a nearby crater. Good chance to find cool rocks!',
        discoveryMultiplier: 1.0,
        rareBonus: 1.0,
      },
      3: {
        barsCost: 3,
        durationSeconds: 70,
        name: 'Far Riverbed Dig (30 ⚡)',
        desc: 'Long trip far away to an old riverbed. Best chance for rare gems!',
        discoveryMultiplier: 1.35,
        rareBonus: 1.8,
      },
    };

    const SAMPLE_CATALOG = [
      {
        id: 'BASALT',
        name: 'Black Lava Rock (Basalt)',
        points: 10,
        baseProbability: 30,
        isRare: false,
        variations: [
          'This dark rock has tiny holes from gas bubbles. Mars used to have big volcanoes!',
          'A hard black rock made from cooled lava (melted rock from a volcano).',
          'Strong Mars winds blew sand against this rock and made it super smooth.',
        ],
        scientificNote: 'Fun Fact: Basalt is dark rock made when hot volcano lava cools down.',
      },
      {
        id: 'IRON_OXIDE',
        name: 'Red Rusty Rock',
        points: 15,
        baseProbability: 15,
        isRare: false,
        variations: [
          'Red rust dust covers this rock. That is why Mars looks like the Red Planet!',
          'Full of tiny iron balls that turned red from sunlight and old water.',
          'This rusty rock shows that Mars dirt has lots of iron (a metal) inside.',
        ],
        scientificNote: 'Fun Fact: Iron turns red like rust when it touches water and oxygen.',
      },
      {
        id: 'HYDRATED',
        name: 'Water-Drop Crystal Rock',
        points: 30,
        baseProbability: 9,
        isRare: true,
        variations: [
          'Awesome! Tiny drops of water are trapped inside. Mars once had big lakes!',
          'This white rock formed when underground water flowed through the dirt.',
          'Our scanner found water inside this crystal—a warm pond was once here!',
        ],
        scientificNote: 'Fun Fact: Water crystals help scientists find where lakes used to be on Mars.',
      },
      {
        id: 'SPECIAL_GEO',
        name: 'Layer-Cake Magnet Stone',
        points: 25,
        baseProbability: 15,
        isRare: true,
        variations: [
          'Striped like a layer cake! Old rivers stacked mud and sand in neat layers.',
          'This rock acts like a weak magnet from when Mars was a young planet.',
          'Dried mud cracks on this stone show Mars once had rainy days and sunny days.',
        ],
        scientificNote: 'Fun Fact: Rock layers are like pages in a storybook about Mars weather.',
      },
      {
        id: 'ANCIENT_BIOSIGNATURE',
        name: 'Mystery Life-Clue Stone',
        points: 999,
        baseProbability: 1,
        isRare: true,
        variations: [
          'Super discovery! Tiny swirls and special carbon clues found—let us send this to Earth!',
        ],
        scientificNote: 'Special Win: You found a huge clue! Real NASA rovers are still looking for this.',
      },
      {
        id: 'NONE',
        name: 'No Rock Found',
        points: 0,
        baseProbability: 30,
        isRare: false,
        variations: [
          'Only soft sand here! The robot arm could not grab a solid rock.',
          'Thick dust covered the ground so the drill could not reach hard rock.',
          'The rock was too soft and turned into dust when the rover grabbed it.',
        ],
        scientificNote: 'Tip: Give Curiosity Jr. 20 or 30 Power to drive farther and find more rocks!',
      },
    ];

    const HISTORICAL_MARS_WEATHER = [
      { tempMax: -9,  tempMin: -68, windSpeedMs: 4.1 },
      { tempMax: -12, tempMin: -72, windSpeedMs: 5.2 },
      { tempMax: -16, tempMin: -77, windSpeedMs: 6.8 },
      { tempMax: -19, tempMin: -80, windSpeedMs: 7.1 },
      { tempMax: -24, tempMin: -86, windSpeedMs: 8.9 },
      { tempMax: -27, tempMin: -89, windSpeedMs: 9.4 },
    ];

    const RADIATION_LABELS = {
      1: { text: 'Very Safe', color: 'bg-emerald-500', advice: 'Calm sun rays—great day to send Curiosity Jr. out!' },
      2: { text: 'Safe', color: 'bg-green-500', advice: 'Good space weather for exploring outside!' },
      3: { text: 'Medium', color: 'bg-amber-500', advice: 'Sun rays (radiation) are a bit strong today.' },
      4: { text: 'High', color: 'bg-orange-500', advice: 'Strong sun rays (radiation) might hurt the rover!' },
      5: { text: 'Danger', color: 'bg-red-500', advice: 'Huge sun storm! Keep the rover safe inside the garage.' },
    };

    // =========================================================================
    // [Color Gradient Interpolation Helper for Smooth Day/Night Transition]
    // =========================================================================
    function lerpHexColor(hexA, hexB, t) {
      const clamped = Math.max(0, Math.min(1, t));
      const a = parseInt(hexA.replace('#', ''), 16);
      const b = parseInt(hexB.replace('#', ''), 16);
      const rA = (a >> 16) & 255, gA = (a >> 8) & 255, bA = a & 255;
      const rB = (b >> 16) & 255, gB = (b >> 8) & 255, bB = b & 255;
      const r = Math.round(rA + (rB - rA) * clamped);
      const g = Math.round(gA + (gB - gA) * clamped);
      const bl = Math.round(bA + (bB - bA) * clamped);
      return `rgb(${r}, ${g}, ${bl})`;
    }

    function getDayNightPalette(nightFactor) {
      const t = Math.max(0, Math.min(1, nightFactor));
      let skyTop, skyMid, skyBot;
      let mountainFill, groundTop, groundBot, craterFill;
      let starOpacity;

      if (t <= 0.2) {
        const u = t / 0.2;
        skyTop = lerpHexColor('#d97757', '#f5a97f', u);
        skyMid = lerpHexColor('#d9917d', '#f7c49f', u);
        skyBot = lerpHexColor('#c86b49', '#e5885c', u);
        mountainFill = lerpHexColor('#8f4e3c', '#d97a50', u);
        groundTop = lerpHexColor('#ad5b3c', '#e58758', u);
        groundBot = lerpHexColor('#783824', '#c9653b', u);
        craterFill = lerpHexColor('#6e311f', '#b85932', u);
        starOpacity = (1 - u) * 0.15;
      } else if (t <= 0.5) {
        skyTop = '#f5a97f';
        skyMid = '#f7c49f';
        skyBot = '#e5885c';
        mountainFill = '#d97a50';
        groundTop = '#e58758';
        groundBot = '#c9653b';
        craterFill = '#b85932';
        starOpacity = 0;
      } else if (t <= 0.75) {
        const u = (t - 0.5) / 0.25;
        skyTop = lerpHexColor('#f5a97f', '#c26d5c', u);
        skyMid = lerpHexColor('#f7c49f', '#8c5368', u);
        skyBot = lerpHexColor('#e5885c', '#a85548', u);
        mountainFill = lerpHexColor('#d97a50', '#7a423b', u);
        groundTop = lerpHexColor('#e58758', '#9e523f', u);
        groundBot = lerpHexColor('#c9653b', '#6b3323', u);
        craterFill = lerpHexColor('#b85932', '#5e2719', u);
        starOpacity = u * 0.5;
      } else if (t <= 0.9) {
        const u = (t - 0.75) / 0.15;
        skyTop = lerpHexColor('#c26d5c', '#141d30', u);
        skyMid = lerpHexColor('#8c5368', '#23304a', u);
        skyBot = lerpHexColor('#a85548', '#3d2522', u);
        mountainFill = lerpHexColor('#7a423b', '#3d2522', u);
        groundTop = lerpHexColor('#6e3a28', '#6e3a28', u);
        groundBot = lerpHexColor('#6b3323', '#3d1e14', u);
        craterFill = lerpHexColor('#5e2719', '#381810', u);
        starOpacity = 0.5 + u * 0.5;
      } else {
        const u = (t - 0.9) / 0.1;
        skyTop = lerpHexColor('#141d30', '#d97757', u);
        skyMid = lerpHexColor('#23304a', '#d9917d', u);
        skyBot = lerpHexColor('#3d2522', '#c86b49', u);
        mountainFill = lerpHexColor('#3d2522', '#8f4e3c', u);
        groundTop = lerpHexColor('#6e3a28', '#ad5b3c', u);
        groundBot = lerpHexColor('#3d1e14', '#783824', u);
        craterFill = lerpHexColor('#381810', '#6e311f', u);
        starOpacity = (1 - u) * 0.85;
      }

      const domeGlassBlue = lerpHexColor('#79b4e3', '#fde047', t > 0.6 ? (t - 0.6) / 0.35 : 0);
      const powerGlassBlue = lerpHexColor('#6898d8', '#facc15', t > 0.6 ? (t - 0.6) / 0.35 : 0);
      const greenhouseGlass = lerpHexColor('#9be082', '#bef264', t > 0.6 ? (t - 0.6) / 0.35 : 0);

      return {
        skyTop,
        skyMid,
        skyBot,
        mountainFill,
        groundTop,
        groundBot,
        craterFill,
        domeGlassBlue,
        powerGlassBlue,
        greenhouseGlass,
        starOpacity,
      };
    }

    // =========================================================================
    // [Module 2: NASA Data & Mars Weather Service]
    // =========================================================================
    const NasaService = (() => {
      const NASA_IMAGE_API = 'https://images-api.nasa.gov/search';
      const NASA_DONKI_SEP_API = 'https://api.nasa.gov/DONKI/SEP';
      const API_KEY = 'DEMO_KEY';

      let cachedCuriosityPhotos = [];
      let cachedSepEventsCount = null;

      async function fetchNextCuriosityPhoto(usedIds) {
        try {
          if (cachedCuriosityPhotos.length === 0) {
            const query = encodeURIComponent('Curiosity Mastcam Gale Crater');
            const response = await fetch(`${NASA_IMAGE_API}?q=${query}&media_type=image&page_size=60`);
            const json = await response.json();
            const items = json?.collection?.items || [];

            cachedCuriosityPhotos = items
              .filter((item) => {
                const info = item.data?.[0];
                if (!info?.nasa_id || !item.links?.[0]?.href) return false;
                const text = `${info.title || ''} ${info.description || ''}`.toLowerCase();
                const isCuriosity = text.includes('curiosity');
                const isNotArt = !text.includes('artist') && !text.includes('illustration') && !text.includes('concept');
                return isCuriosity && isNotArt;
              })
              .map((item) => {
                const info = item.data[0];
                const rawDesc = (info.description || info.title || '').replace(/<[^>]*>?/gm, '');
                const shortDesc = rawDesc.length > 130 ? `${rawDesc.slice(0, 130)}...` : rawDesc;
                return {
                  id: info.nasa_id,
                  title: info.title,
                  imageUrl: item.links[0].href,
                  nasaCaption: shortDesc,
                };
              });
          }
        } catch (err) {
          cachedCuriosityPhotos = [];
        }

        if (cachedCuriosityPhotos.length === 0) {
          return {
            id: 'FALLBACK_MARS',
            title: 'Mars Rocks and Sand Dunes',
            imageUrl: 'https://images-assets.nasa.gov/image/PIA16764/PIA16764~thumb.jpg',
            nasaCaption: 'Real Mars rocks and sandy ground taken by NASA Curiosity Rover.',
          };
        }

        const available = cachedCuriosityPhotos.filter((p) => !usedIds.has(p.id));
        const pool = available.length > 0 ? available : cachedCuriosityPhotos;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      async function generateDailyMarsEnvironment(sol) {
        if (cachedSepEventsCount === null) {
          try {
            const endDate = new Date().toISOString().slice(0, 10);
            const startObj = new Date();
            startObj.setDate(startObj.getDate() - 60);
            const startDate = startObj.toISOString().slice(0, 10);

            const res = await fetch(`${NASA_DONKI_SEP_API}?startDate=${startDate}&endDate=${endDate}&api_key=${API_KEY}`);
            const events = await res.json();
            cachedSepEventsCount = Array.isArray(events) ? events.length : 1;
          } catch (err) {
            cachedSepEventsCount = 1;
          }
        }

        const baseWeather = HISTORICAL_MARS_WEATHER[Math.floor(Math.random() * HISTORICAL_MARS_WEATHER.length)];
        const stormChance = sol <= 5 ? 0.20 : sol <= 10 ? 0.35 : sol <= 15 ? 0.50 : 0.60;
        const isDustStorm = Math.random() < stormChance;

        const activityBias = Math.min(2, Math.floor(cachedSepEventsCount / 2));
        const phaseBias = sol <= 5 ? 0 : sol <= 12 ? 1 : 2;
        const rawLevel = 1 + Math.floor(Math.random() * 2) + Math.floor((activityBias + phaseBias) / 2);
        const radiationLevel = Math.min(5, Math.max(1, rawLevel));

        return {
          tempMax: baseWeather.tempMax,
          tempMin: baseWeather.tempMin,
          windSpeedMs: isDustStorm ? +(baseWeather.windSpeedMs + 8.5).toFixed(1) : baseWeather.windSpeedMs,
          isDustStorm,
          radiationLevel,
        };
      }

      return { fetchNextCuriosityPhoto, generateDailyMarsEnvironment };
    })();

    // =========================================================================
    // [Module 3: Core Game Rules & Calculations]
    // =========================================================================
    const GameLogicModule = (() => {
      function rollRoverExplorationByCost(barsCost) {
        const mode = ROVER_DISPATCH_MODES[barsCost] || ROVER_DISPATCH_MODES[2];
        const roll = Math.random() * 100;
        let acc = 0;
        let chosenSpec = SAMPLE_CATALOG.find((s) => s.id === 'NONE');

        for (const sample of SAMPLE_CATALOG) {
          if (sample.id === 'NONE') continue;
          const weight = sample.isRare
            ? sample.baseProbability * mode.discoveryMultiplier * mode.rareBonus
            : sample.baseProbability * mode.discoveryMultiplier;

          acc += weight;
          if (roll < acc) {
            chosenSpec = sample;
            break;
          }
        }

        const randomStory =
          chosenSpec.variations[Math.floor(Math.random() * chosenSpec.variations.length)];

        return {
          ...chosenSpec,
          chosenExplanation: randomStory,
        };
      }

      function evaluateRoverReturnHazard(isDustStorm, radiationLevel) {
        let hazardChance = 0;
        const reasons = [];

        if (isDustStorm) {
          hazardChance += 0.35;
          reasons.push('dust storm sand stuck in the wheels');
        }
        if (radiationLevel === 4) {
          hazardChance += 0.30;
          reasons.push('strong sun rays (radiation)');
        } else if (radiationLevel === 5) {
          hazardChance += 0.55;
          reasons.push('a huge sun storm');
        }

        if (hazardChance > 0 && Math.random() < Math.min(0.85, hazardChance)) {
          const freezeSols = (isDustStorm && radiationLevel >= 4) || radiationLevel === 5 ? 2 : 1;
          return {
            isDamaged: true,
            damagedSols: freezeSols,
            reasonText: reasons.join(' and '),
          };
        }

        return {
          isDamaged: false,
          damagedSols: 0,
          reasonText: reasons.join(' and '),
          wasHazardous: hazardChance > 0,
        };
      }

      function getGreenhouseSeparateOptions(tempMin) {
        const isExtremeCold = tempMin <= -76;

        return {
          weatherTag: isExtremeCold
            ? `Freezing Night (${tempMin}°C)`
            : `Chilly Night (${tempMin}°C)`,
          tempOptions: isExtremeCold
            ? [
                {
                  id: 'TEMP_ECO',
                  title: 'Warm Blanket + Low Light',
                  powerCost: 4,
                  minGain: 1,
                  maxGain: 2,
                  desc: 'Keeps plants safe from freezing while saving power.',
                },
                {
                  id: 'TEMP_WARM',
                  title: 'Big Heater + Bright Sun Lamps',
                  powerCost: 10,
                  minGain: 2,
                  maxGain: 3,
                  desc: 'Super warm and bright—helps watered tomatoes grow twice as fast!',
                },
              ]
            : [
                {
                  id: 'TEMP_ECO',
                  title: 'Cozy Heat + Soft Lamps',
                  powerCost: 3,
                  minGain: 1,
                  maxGain: 2,
                  desc: 'Keeps a nice room temperature and saves power.',
                },
                {
                  id: 'TEMP_WARM',
                  title: 'Bright Sun Grow Lamps',
                  powerCost: 8,
                  minGain: 2,
                  maxGain: 3,
                  desc: 'Shines extra light on leaves so watered tomatoes grow much faster!',
                },
              ],
        };
      }

      function calculateDailyResourceConsumption(weather, roverStatus) {
        let powerCost = 8;
        const powerReasons = ['Base air & lights (-8)'];

        if (weather.tempMin <= -80) {
          powerCost += 5;
          powerReasons.push(`Super cold ${weather.tempMin}°C extra heater (-5)`);
        } else if (weather.tempMin <= -74) {
          powerCost += 3;
          powerReasons.push(`Cold night ${weather.tempMin}°C heater (-3)`);
        } else {
          powerCost += 1;
          powerReasons.push(`Night cabin warmth (-1)`);
        }

        if (weather.isDustStorm) {
          powerCost += 2;
          powerReasons.push('Dust storm air cleaner (-2)');
        }

        let waterCost = 4;
        const waterReasons = ['Drinking & washing (-4)'];
        if (weather.windSpeedMs >= 8.0) {
          waterCost += 2;
          waterReasons.push('Dry windy air mist (-2)');
        } else if (Math.random() < 0.4) {
          waterCost += 1;
          waterReasons.push('Water filter rinse (-1)');
        }

        let foodCost = 10;
        const foodReasons = ['Astronaut meals (-10)'];
        if (roverStatus === 'OUT_ON_MISSION' || weather.isDustStorm) {
          foodCost += 2;
          foodReasons.push('Busy mission extra snack (-2)');
        } else if (Math.random() < 0.5) {
          foodCost += 1;
          foodReasons.push('Space workout snack (-1)');
        }

        let oxygenCost = 10;
        const oxygenReasons = ['Breathing air (-10)'];
        if (weather.radiationLevel >= 4) {
          oxygenCost += 2;
          oxygenReasons.push('High sun rays airlock seal (-2)');
        }

        return {
          powerCost,
          powerReasonText: powerReasons.join(', '),
          waterCost,
          waterReasonText: waterReasons.join(', '),
          foodCost,
          foodReasonText: foodReasons.join(', '),
          oxygenCost,
          oxygenReasonText: oxygenReasons.join(', '),
        };
      }

      // Uses index.html's solar power numbers (up to 25 clear / 13 storm on Day 1) and decreases as days (sol) pass!
      // Note: We do NOT display any "dust reduces X%" text in the UI.
      function calculateSolarGameReward(caughtCount, isDustStorm, sol = 1) {
        if (caughtCount <= 0) return 0;
        const perLight = isDustStorm ? 1.0 : 1.5;
        const baseMaxCap = isDustStorm ? 13 : 25;
        const dayFactor = Math.max(0.55, 1 - (Math.max(1, sol) - 1) * 0.022);
        const maxCap = Math.max(6, Math.round(baseMaxCap * dayFactor));
        const rawPower = Math.round(caughtCount * perLight * dayFactor);
        return Math.min(maxCap, Math.max(1, rawPower));
      }

      function getSolarEfficiencyGrade(caughtCount, isDustStorm) {
        if (caughtCount <= 0) return { label: 'No Sunlight Caught', color: 'text-red-500' };
        const highThreshold = isDustStorm ? 10 : 14;
        const midThreshold = isDustStorm ? 6 : 9;
        if (caughtCount >= highThreshold) return { label: 'Super Sun Catcher!', color: 'text-amber-600' };
        if (caughtCount >= midThreshold) return { label: 'Great Job!', color: 'text-emerald-600' };
        return { label: 'Some Power Saved', color: 'text-sky-600' };
      }

      function getAstronautRank(score) {
        if (score >= 180) return 'Mars Science Champion';
        if (score >= 120) return 'Super Mars Astronaut';
        if (score >= 70) return 'Red Planet Explorer';
        if (score >= 30) return 'Junior Astronaut';
        return 'Space Cadet';
      }

      return {
        rollRoverExplorationByCost,
        evaluateRoverReturnHazard,
        getGreenhouseSeparateOptions,
        calculateDailyResourceConsumption,
        calculateSolarGameReward,
        getSolarEfficiencyGrade,
        getAstronautRank,
      };
    })();

    // =========================================================================
    // [Module 5: Solar Catch Mini-Game Modal]
    // - Uses index.html power numbers that decrease as days pass
    // - Includes kid-friendly explanation about tilting solar panels to face the sun!
    // - Does NOT show "dust reduces X%" text
    // =========================================================================
    function SolarMiniGameModal({ sol, isDustStorm, onComplete, onClose }) {
      const GAME_DURATION = 15;
      const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
      const [panelX, setPanelX] = useState(50);
      const [caughtCount, setCaughtCount] = useState(0);
      const [panelFlash, setPanelFlash] = useState(false);
      const [beams, setBeams] = useState([]);
      const [finished, setFinished] = useState(false);

      const panelXRef = useRef(50);
      const caughtRef = useRef(0);
      const spawnedCountRef = useRef(0);
      const arenaRef = useRef(null);

      const updatePanelFromClientX = (clientX) => {
        if (!arenaRef.current || finished) return;
        const rect = arenaRef.current.getBoundingClientRect();
        const relX = ((clientX - rect.left) / rect.width) * 100;
        const clamped = Math.max(12, Math.min(88, relX));
        panelXRef.current = clamped;
        setPanelX(clamped);
      };

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              setFinished(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (finished) return;

        const spawnInterval = setInterval(() => {
          if (spawnedCountRef.current >= 45) return;
          spawnedCountRef.current += 1;
          const id = Math.random().toString(36).slice(2);
          const startX = 10 + Math.random() * 80;
          const speed = isDustStorm ? 2.5 : 4.0;
          setBeams((prev) => [...prev, { id, x: startX, y: 0, speed }]);
        }, isDustStorm ? 480 : 310);

        const loop = setInterval(() => {
          setBeams((prev) => {
            const next = [];
            for (const b of prev) {
              const nextY = b.y + b.speed;
              if (nextY >= 80 && nextY <= 91 && Math.abs(b.x - panelXRef.current) <= 13) {
                caughtRef.current += 1;
                setCaughtCount(caughtRef.current);
                setPanelFlash(true);
                setTimeout(() => setPanelFlash(false), 120);
              } else if (nextY < 100) {
                next.push({ ...b, y: nextY });
              }
            }
            return next;
          });
        }, 33);

        return () => {
          clearInterval(spawnInterval);
          clearInterval(loop);
        };
      }, [finished, isDustStorm]);

      const livePowerPreview = GameLogicModule.calculateSolarGameReward(caughtCount, isDustStorm, sol);
      const gradeInfo = GameLogicModule.getSolarEfficiencyGrade(caughtCount, isDustStorm);

      return (
        <div className="fixed inset-0 bg-[#2d1e12]/75 flex items-center justify-center p-4 z-50">
          <div className="bg-[#fdf6e9] border-4 border-[#d9c2a3] rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-3">
            <div className="flex flex-wrap justify-between items-center gap-1 text-xs">
              <span className="font-black text-amber-800 text-sm">
                ☀️ Move the Solar Panel to Catch Sunbeams!
              </span>
              <div className="flex items-center gap-2 font-bold">
                <span className="text-[#6b4c35]">{timeLeft}s left</span>
                <span className="px-2.5 py-0.5 rounded-full bg-amber-300 text-amber-950 font-black">
                  Power: +{livePowerPreview} ⚡
                </span>
              </div>
            </div>

            {/* Kid-friendly explanation about tilting solar panels to face the sun */}
            <div className="bg-amber-100/90 border border-amber-300 rounded-2xl px-3 py-2 text-xs text-amber-950 font-semibold leading-snug">
              💡 <b>How Solar Panels Work:</b> Moving the solar panel is like tilting its angle to face the sun! When solar panels point straight at the sun, they catch the most sunlight and turn it into electricity for our base.
            </div>

            <div
              ref={arenaRef}
              onMouseMove={(e) => updatePanelFromClientX(e.clientX)}
              onTouchMove={(e) => updatePanelFromClientX(e.touches[0].clientX)}
              onClick={(e) => updatePanelFromClientX(e.clientX)}
              className={`relative w-full h-56 rounded-2xl overflow-hidden border-2 cursor-pointer ${
                isDustStorm
                  ? 'bg-gradient-to-b from-amber-700 to-stone-800 border-amber-600'
                  : 'bg-gradient-to-b from-sky-600 to-indigo-900 border-sky-400'
              }`}
            >
              {isDustStorm && (
                <div className="top-2 left-2 absolute text-[11px] bg-amber-100/95 text-amber-900 font-bold px-2.5 py-0.5 rounded-full">
                  🌪️ Dust storm clouds are blocking some sunlight today!
                </div>
              )}

              {beams.map((b) => (
                <div
                  key={b.id}
                  style={{ left: `${b.x}%`, top: `${b.y}%` }}
                  className="-translate-x-1/2 -translate-y-1/2 absolute text-2xl drop-shadow-[0_0_8px_rgba(253,224,71,0.95)] pointer-events-none"
                >
                  ☀️
                </div>
              ))}

              <div
                style={{ left: `${panelX}%` }}
                className={`-translate-x-1/2 bottom-3 absolute w-24 h-5 rounded-lg border-2 flex items-center justify-center text-[11px] font-black pointer-events-none transition-transform duration-75 ${
                  panelFlash
                    ? 'bg-yellow-300 border-white text-slate-900 scale-110 shadow-[0_0_16px_rgba(253,224,71,1)]'
                    : 'bg-sky-400 border-white text-slate-950 shadow-md'
                }`}
              >
                Solar Panel
              </div>

              {finished && (
                <div className="inset-0 absolute bg-[#2d1e12]/85 flex flex-col items-center justify-center p-4 text-center space-y-2">
                  <div className="text-xs font-bold text-amber-100">
                    You caught {caughtCount} sunbeams!
                  </div>
                  <div className={`text-base font-black bg-white px-3 py-0.5 rounded-full ${gradeInfo.color}`}>
                    {gradeInfo.label}
                  </div>
                  <div className="text-2xl font-black text-yellow-300">
                    Power Made: +{livePowerPreview} ⚡
                  </div>
                  <button
                    onClick={() => onComplete(caughtCount)}
                    className="px-6 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-[#3b2514] font-black text-sm shadow-lg active:scale-95 transition"
                  >
                    Save Power to Base!
                  </button>
                </div>
              )}
            </div>

            <div className="flex justify-between items-center text-xs text-[#7a5a40] h-6">
              <span>Slide or tap to aim the solar panel at the sunbeams!</span>
              {!finished && (
                <button onClick={onClose} className="underline font-bold hover:text-amber-900">
                  Cancel
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // [Module 8: Greenhouse Interactive Scene Module]

      resources,
      weather,
      tomatoProgress,
      tomatoProgresses = [1, 1, 1, 1],
      wateredPlants = [false, false, false, false],
      todayTempOption,
      seenTopics,
      onOpenTopic,
      onBack,
      onWaterSinglePlant,
      onPlantSeeds,
      onHarvestSinglePlant,
      onRequestSelectTempOption,

      const plantList = Array.isArray(tomatoProgresses)
        ? tomatoProgresses
        : [tomatoProgress, tomatoProgress, tomatoProgress, tomatoProgress];
      const [flyingTomatoes, setFlyingTomatoes] = useState([false, false, false, false]);
      const [activeWaterPlantIdx, setActiveWaterPlantIdx] = useState(null);
      const [isHoldingCan, setIsHoldingCan] = useState(false);
      const [isDraggingCan, setIsDraggingCan] = useState(false);
      const [showLampModal, setShowLampModal] = useState(false);

      const safeTempMin = weather && typeof weather.tempMin === 'number' ? weather.tempMin : -75;
      const greenhouseConfig = GameLogicModule.getGreenhouseSeparateOptions(safeTempMin);

      const anyRipe = plantList.some((p) => p >= MAX_TOMATO_GROWTH);
      const needsWater = plantList.some((p, i) => p < MAX_TOMATO_GROWTH && !wateredPlants[i]);
      const allWatered = plantList.every((p, i) => p >= MAX_TOMATO_GROWTH || wateredPlants[i]);

      const applyWaterToPlant = (idx) => {
        const prog = plantList[idx];
        if (!wateredPlants[idx] && resources.water >= 2 && prog < MAX_TOMATO_GROWTH) {
          onWaterSinglePlant(idx);
          setActiveWaterPlantIdx(idx);
          setTimeout(() => setActiveWaterPlantIdx(null), 700);
        }
      };

      const handlePlantClick = (idx) => {
        const prog = plantList[idx];
        if (prog >= MAX_TOMATO_GROWTH) {
          setFlyingTomatoes((prev) => {
            const next = [...prev];
            next[idx] = true;
            return next;
          });
          setTimeout(() => {
            setFlyingTomatoes((prev) => {
              const next = [...prev];
              next[idx] = false;
              return next;
            });
          }, 800);
          if (onHarvestSinglePlant) onHarvestSinglePlant(idx);
        }
      };

      const renderLeaf = (x, y, scale, rotate) => (
        <g transform={`translate(${x}, ${y}) rotate(${rotate}) scale(${scale})`}>

            strokeWidth="2"

      const renderTomatoFruit = (x, y, r) => (

          <ellipse cx={-r * 0.32} cy={-r * 0.15} rx={r * 0.22} ry={r * 0.35} transform="rotate(-25)" fill="#fca5a5" opacity="0.85" />
          <polygon
            points={`0,${-r + 1} -5,${-r - 5} -2,${-r + 3} -9,${-r + 4} -2,${-r + 6} 0,${-r + 9} 2,${-r + 6} 9,${-r + 4} 2,${-r + 3} 5,${-r - 5}`}
            fill="#16a34a"
            stroke="#14532d"
            strokeWidth="1.2"
          />
        </g>
      );

      return (
        <div className="relative w-full aspect-[16/10] rounded-3xl overflow-hidden border-4 border-[#d9c2a3] shadow-xl bg-[#e6f4ea]">
          <svg viewBox="0 0 1000 625" className="w-full h-full object-cover block">
            <rect width="1000" height="470" fill="#dff2e4" />
            <polygon points="0,470 1000,470 1000,625 0,625" fill="#e9d8be" />
            <path d="M50,470 C50,80 950,80 950,470" fill="none" stroke="#9ac4a6" strokeWidth="8" />
            <line x1="300" y1="120" x2="300" y2="470" stroke="#b6d9bf" strokeWidth="5" />
            <line x1="700" y1="120" x2="700" y2="470" stroke="#b6d9bf" strokeWidth="5" />

            {/* Greenhouse Sun Grow Lamps (Interactive!) */}
            {[275, 455, 635].map((lx, i) => (
              <g key={i} transform={`translate(${lx - 45}, 115)`}>
                <line x1="45" y1="-35" x2="45" y2="10" stroke="#6b7280" strokeWidth="5" />

                  opacity={todayTempOption ? (todayTempOption.id === 'TEMP_WARM' ? '0.58' : '0.38') : '0.12'}

            {/* Left Tool Stand Shelf */}
            <g transform="translate(45, 330)">
              <rect x="0" y="70" width="130" height="20" rx="6" fill="#c88a55" stroke="#6e4726" strokeWidth="4" />

            {/* Planter Soil Bed */}

                        {renderTomatoFruit(-4, -68, 13)}

            <svg viewBox="0 0 80 80" className="w-20 h-20 drop-shadow-md">

              <ellipse cx="38" cy="33" rx="10" ry="4" fill="#bae6fd" stroke="#0284c7" strokeWidth="3" />
              <path d="M 52 48 L 70 30" stroke="#0284c7" strokeWidth="7" strokeLinecap="round" />
              <ellipse cx="72" cy="28" rx="6" ry="10" transform="rotate(-35 72 28)" fill="#facc15" stroke="#ca8a04" strokeWidth="3" />
              <circle cx="72" cy="28" r="1.5" fill="#78350f" />
              <circle cx="70" cy="25" r="1.5" fill="#78350f" />
              <circle cx="74" cy="31" r="1.5" fill="#78350f" />
              <path d="M 38 42 C 38 42 32 50 32 53 C 32 56 35 58 38 58 C 41 58 44 56 44 53 C 44 50 38 42 38 42 Z" fill="#ffffff" opacity="0.9" />
            </svg>

            {needsWater && (
              <span className="absolute -top-1 -right-1 flex h-8 w-8 items-center justify-center animate-alert-pulse">
                <span className="animate-ping absolute inline-flex h-8 w-8 rounded-full bg-red-400 opacity-75" />
                <span className="relative inline-flex rounded-full h-7 w-7 bg-red-600 border-2 border-white shadow text-white font-black text-lg leading-none items-center justify-center">
                  !
                </span>
              </span>
            )}
            {needsWater && (
              <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 pointer-events-none whitespace-nowrap">
                <span className="animate-float px-2.5 py-0.5 rounded-full bg-sky-500 text-white font-black text-[10px] shadow border border-white">
                  Drag to Water! 💧
                </span>
              </div>
            )}
            {allWatered && !anyRipe && (
              <span className="absolute -top-1 -right-1 inline-flex rounded-full h-6 w-6 bg-emerald-500 border-2 border-white shadow text-white font-black text-xs items-center justify-center">
                ✓
              </span>
            )}
          </div>

          {/* 4 Interactive Drop / Sweep Targets for Each Tomato Plant */}
          <div
            className="absolute left-[21.5%] top-[42%] w-[51%] h-[38%] z-20 flex"
            onTouchMove={(e) => {
              if (!isHoldingCan && !isDraggingCan) return;
              const touch = e.touches[0];
              const el = document.elementFromPoint(touch.clientX, touch.clientY);
              const plantEl = el?.closest('[data-plant-idx]');
              if (plantEl) {
                const idx = Number(plantEl.getAttribute('data-plant-idx'));
                if (!isNaN(idx) && !wateredPlants[idx] && plantList[idx] < MAX_TOMATO_GROWTH) {
                  applyWaterToPlant(idx);
                }
              }
            }}
          >
            {[0, 1, 2, 3].map((idx) => {
              const isWatered = wateredPlants[idx];
              const isRipe = plantList[idx] >= MAX_TOMATO_GROWTH;
              return (
                <div
                  key={idx}
                  data-plant-idx={idx}
                  onDragOver={(e) => {
                    e.preventDefault();
                    if (!isWatered && !isRipe) {
                      applyWaterToPlant(idx);
                    }
                  }}
                  onDrop={(e) => {
                    e.preventDefault();
                    if (!isRipe) applyWaterToPlant(idx);
                  }}
                  onMouseEnter={() => {
                    if (isDraggingCan && !isWatered && !isRipe) {
                      applyWaterToPlant(idx);
                    }
                  }}
                  onPointerEnter={() => {
                    if (isDraggingCan && !isWatered && !isRipe) {
                      applyWaterToPlant(idx);
                    }
                  }}
                  onClick={() => handlePlantClick(idx)}
                  className={`flex-1 h-full cursor-pointer relative flex flex-col items-center justify-end pb-3 rounded-2xl transition hover:bg-emerald-300/20 active:scale-95 ${

                  >

                      ? '🍅 Pick (+6)'

                  </span>
                </div>

                </div>
